# ArtPad Kconfig options.

# Encoders: the EC11 driver itself turns on automatically because the overlay
# has alps,ec11 nodes. This picks how encoder interrupts are processed: on
# ZMK's shared worker thread (the standard choice for keyboards).
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment for debugging over USB: connect to the board's serial port to see
# log output (key events, encoder steps, BLE status).
# CONFIG_ZMK_USB_LOGGING=y
